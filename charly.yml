#  overthinkos/arch — the Arch Linux image family, split out of the main
#  opencharly repo (2026-05). Mounted as a git submodule at box/arch.
#
#  SINGLE-FILE config: every entity (the arch + arch-builder + cuda-arch-builder
#  base/builder stack, the arch-coder/charly-arch/arch-test/vscode-test images,
#  the arch-pacstrap-builder + arch-pacstrap bootstrap pair, the arch +
#  arch-pacstrap VMs, and the disposable check beds) is inlined here or discovered
#  under box/. This repo VENDORS NOTHING — every candy layer is an
#  `@github.com/overthinkos/overthink/candy/...` ref into the main repo. The arch
#  base/builder stack is LOCAL (this submodule owns it after the 2026-06 box
#  inversion), so NO namespace import is needed — every image's base is a bare
#  local `arch`, every multi-stage builder a bare local `arch-builder`.
#
#  Directly buildable: `charly box build arch-coder` (the build verb defaults to
#  this charly.yml). From the parent repo: `charly -C box/arch box build
#  arch-coder`, or anywhere: `charly --repo overthinkos/arch box build arch-coder`.
version: 2026.164.0004
# Canonical repo identity. Optional now that the main↔arch cycle dissolved (main
# imports this repo; this repo imports nothing back), but kept for self-import
# recognition when commands run from inside the submodule.
repo: github.com/overthinkos/arch
defaults:
    platform:
        - linux/amd64
    tag: auto
    registry: ghcr.io/overthinkos
    build:
        - pac
    merge:
        auto: false
        max_mb: 128
# No namespace import: the arch base/builder stack is local to this submodule;
# every candy layer resolves via its own `@github` ref into the main repo.
import: []
discover:
    - path: box
      recursive: true
    - path: candy
      recursive: true
check:
    # Disposable R10 test beds for the arch VMs (kind:check — the 2026-05
    # deploy→check unification moved repo-shipped disposable beds out of
    # deploy.yml). disposable: true is the sole authorization for the
    # unattended destroy+rebuild driven by `charly check run <bed>`. These are
    # zero-side-effect beds (target: vm); there are NO operator deploy entries
    # in this repo, so there is no deploy: section.
    #
    # Relocated from main (2026-06 box inversion) with its vscode-test box: the
    # disposable R10 bed for the Arch vscode direct-download install path. Bare
    # local `box: vscode-test` (the box now lives under box/ in this submodule).
    check-arch-vscode-pod:
        target: pod
        box: vscode-test
        disposable: true
        lifecycle: dev
        description:
            feature: Arch vscode install (version-pinned MS download, sha256-verified) — replaces the broken visual-studio-code-bin AUR
            tag: [working]
        scenario:
            - name: status-shows-vscode-pod
              step:
                - id: status-shows-vscode-pod
                  command: charly status --json
                  in_container: false
                  stdout:
                    - contains: '"kind": "pod"'
                    - contains: check-arch-vscode-pod
                  context:
                    - runtime
    check-arch-pacstrap-vm:
        target: vm
        vm: arch-pacstrap
        disposable: true
        lifecycle: dev
    check-arch-vm:
        target: vm
        vm: arch
        disposable: true
        lifecycle: dev
        # Minimal in-guest tooling so arch-host (child) has something
        # to depend on, and so the command: probes have ripgrep/uv/
        # pre-commit versions to verify.
        add_candy:
            - '@github.com/overthinkos/overthink/candy/ripgrep:v2026.164.1529'
            - '@github.com/overthinkos/overthink/candy/uv:v2026.164.1529'
            - '@github.com/overthinkos/overthink/candy/pre-commit:v2026.164.1529'
        install_opts:
            with_service: true
            allow_repo_changes: true # pacman-key + mirror tweaks
            skip_incompatible: true # skip rpm:/deb:-only layer sections
            verify: true
            # The arch VM is a cloud image (no charly builder context); name the
            # arch-builder image so the npm-building add_candy (pre-commit)
            # resolves a builder. DeploymentNode has no `builder:` map field —
            # install_opts.builder_image is the supported path (mirrors cachyos).
            # Use the local short-ref (arch-builder), NOT a pinned ghcr tag: a
            # full ghcr ref is checked as-is and breaks when that tag is pruned /
            # ghcr publishing is paused (manifest unknown). The short-ref routes
            # through cfg.ResolveImage → newest local arch-builder, and builds it
            # on-demand if absent (same path arch-coder's builder: map uses).
            builder_image: arch-builder
        # -----------------------------------------------------------------
        # Bed 2: arch-host (target: host, nested in check-arch-vm)
        # -----------------------------------------------------------------
        # Exercises HostDeployTarget / InstallPlan / ReverseOps / ledger
        # code path INSIDE check-arch-vm's guest FS via the existing
        # parent-child NestedExecutor plumbing. Zero operator-side writes.
        # Layers chosen for dotfile-only side effects so the bed is about
        # exercising the code path, not installing services.
        # -----------------------------------------------------------------
        nested:
            # -----------------------------------------------------------------
            # R10 bed for tailscale + tailscale-up runtime wiring.
            # ---------------------------------------------------------------
            # Exercises candy/tailscale (daemon install + systemctl enable)
            # AND candy/tailscale-up (--operator + --hostname runtime task)
            # via the nested HostDeployTarget in check-arch-vm. The arch user
            # has uid 1000 + passwordless wheel sudo per the cloud-init
            # config, matching the canonical charly-cachyos host shape.
            # The test bed's tailscaled is logged out (no auth performed),
            # which is the layer's expected pass-by-skip state for the
            # operator-readable / hostname-tracks-system probes — the
            # explicit baseline probes below cover the daemon-up shape.
            # -----------------------------------------------------------------
            charly-cachyos-tailscale-test:
                target: local
                disposable: true
                lifecycle: dev
                add_candy:
                    - '@github.com/overthinkos/overthink/candy/tailscale:v2026.164.1529'
                    - '@github.com/overthinkos/overthink/candy/tailscale-up:v2026.164.1529'
                install_opts:
                    with_service: true
                    allow_root_tasks: true
                description:
                    feature: R10 bed for tailscale + tailscale-up runtime wiring
                    tag: [testing]
                scenario:
                    - name: tt-tailscale-binary
                      step:
                        - {id: tt-tailscale-binary, command: "test -x /usr/bin/tailscale && test -x /usr/sbin/tailscaled", context: [runtime]}
                    - name: tt-tailscaled-active
                      step:
                        - {id: tt-tailscaled-active, command: "systemctl is-active tailscaled", stdout: {equals: active}, context: [runtime]}
                    - name: tt-tailscaled-enabled
                      step:
                        - {id: tt-tailscaled-enabled, command: "systemctl is-enabled tailscaled.service", stdout: {matches: "^enabled"}, context: [runtime],}
                        # The layer-baked operator-readable + hostname-tracks-system
                        # probes self-gate via the "Logged out" check and
                        # pass-by-skip on this bed (no `tailscale up` is performed).
            arch-host:
                target: local
                disposable: true
                lifecycle: dev
                add_candy:
                    - '@github.com/overthinkos/overthink/candy/direnv:v2026.164.1529'
                scenario:
                    - name: ah-deploy-recorded
                      step:
                        # Nested command runs: SSH into check-arch-vm → exec as arch user.
                        # Verify the nested host-deploy was RECORDED in the guest ledger
                        # (a deploys/*.json record exists). NB: we do NOT probe via
                        # `charly deploy show` here — the VM's charly_install.strategy: auto
                        # stages charly at /tmp/charly-<calver> (NOT on $PATH, by design,
                        # so it never shadows a package charly), so a bare `charly` in the
                        # guest is `command not found`. The ledger record is the
                        # venue-agnostic proof that the deploy landed.
                        - {id: ah-deploy-recorded, command: "test -n \"$(ls -A ~/.config/opencharly/installed/deploys/ 2>/dev/null)\"", context: [runtime]}
                    - name: ah-direnv-version
                      step:
                        - {id: ah-direnv-version, command: "direnv --version", context: [runtime]}
                    - name: ah-ledger-deploys-dir
                      step:
                        # Ledger entries land in guest ~/.config/opencharly/installed/
                        # (NOT operator-side).
                        - {id: ah-ledger-deploys-dir, command: "test -d /home/arch/.config/opencharly/installed/deploys", context: [runtime]}
                    - name: ah-ledger-layers-dir
                      step:
                        - {id: ah-ledger-layers-dir, command: "test -d /home/arch/.config/opencharly/installed/layers", context: [runtime]}
                    - name: ah-direnv-installed
                      step:
                        # Ledger directories exist (created on first nested
                        # host-deploy). Per-layer/per-deploy ledger files are
                        # written on the OPERATOR side for nested host-
                        # deploys today (known nested-routing rough edge —
                        # unrelated to schema v4).
                        # On Arch, direnv ships as a pacman package, so the
                        # direnv layer installs it that way (no user-space
                        # bootstrap needed). installed: true is correct.
                        - {id: ah-direnv-installed, package: direnv, installed: true, context: [runtime]}
                    - name: ah-no-listeners
                      step:
                        # Nothing listening (host overlay runs no services).
                        - {id: ah-no-listeners, command: "ss -tlnp 2>/dev/null | wc -l", stdout: {matches: "^[0-9]+"}, context: [runtime]}
                    - name: ah-matching-list
                      step:
                        # matching: verb — operator-map form {contains: X} gives
                        # substring semantics; bare scalar shorthand is equals.
                        - {id: ah-matching-list, matching: "arch-host in list", contains: {contains: "arch"}, context: [runtime]}
        scenario:
            - name: guest-identity-uid
              step:
                # --- C.1  Guest identity + SSH connectivity ---------------
                - {id: guest-identity-uid, command: id, stdout: {contains: "uid=1000(arch)"}, context: [runtime]}
            - name: guest-identity-wheel
              step:
                - {id: guest-identity-wheel, command: id, stdout: {contains: wheel}, context: [runtime]}
            - name: guest-hostname-nonempty
              step:
                - {id: guest-hostname-nonempty, command: "cat /etc/hostname", stdout: {matches: ".+"}, context: [runtime]}
            - name: guest-os-release-arch
              step:
                - {id: guest-os-release-arch, command: "cat /etc/os-release", stdout: {contains: "ID=arch"}, context: [runtime]}
            - name: guest-sudo-nopasswd
              step:
                - {id: guest-sudo-nopasswd, command: "sudo -n whoami", stdout: {equals: root}, context: [runtime]}
            - name: guest-kernel-release
              step:
                - {id: guest-kernel-release, command: "uname -r", stdout: {matches: "[0-9]+\\.[0-9]+"}, context: [runtime]}
            - name: cloud-init-status-done
              step:
                # --- C.2  Cloud-init completion ---------------------------
                - {id: cloud-init-status-done, command: "cloud-init status --wait --long", stdout: {contains: "status: done"}, context: [runtime]}
            - name: cloud-init-instance-dir
              step:
                - {id: cloud-init-instance-dir, command: "test -d /var/lib/cloud/instance", context: [runtime]}
            - name: cloud-init-no-errors
              step:
                - {id: cloud-init-no-errors, command: "cat /var/lib/cloud/data/result.json", stdout: {contains: "\"errors\": []"}, context: [runtime]}
            - name: spice-vdagentd-active
              step:
                # --- C.3  spice-vdagent + virtio-gpu (in guest) ----------
                - {id: spice-vdagentd-active, command: "systemctl is-active spice-vdagentd", stdout: {equals: active}, context: [runtime]}
            - name: spice-vdagentd-enabled
              step:
                - {id: spice-vdagentd-enabled, command: "systemctl is-enabled spice-vdagentd", stdout: {matches: "^(enabled|static)"}, context: [runtime]}
            - name: virtio-gpu-module
              step:
                - {id: virtio-gpu-module, command: "lsmod | grep -q virtio_gpu", context: [runtime]}
            - name: dri-card0-present
              step:
                - {id: dri-card0-present, command: "test -e /dev/dri/card0", context: [runtime]}
            - name: spice-status-main
              step:
                # --- C.4  SPICE wire (host-side via spice: verb) ---------
                - {id: spice-status-main, spice: status, stdout: {contains: display}, context: [runtime]}
            - name: spice-framebuffer-nonzero
              step:
                - id: spice-framebuffer-nonzero
                  spice: screenshot
                  artifact: /tmp/check-arch-vm-spice.png
                  artifact_min_bytes: 1024
                  context:
                    - runtime
            - name: libvirt-domain-running
              step:
                # --- C.5  libvirt domain (host-side via libvirt: verb) ---
                - {id: libvirt-domain-running, libvirt: info, stdout: {contains: running}, context: [runtime]}
            - name: libvirt-domain-xml-q35
              step:
                - {id: libvirt-domain-xml-q35, libvirt: "domain-xml", stdout: {contains: q35}, context: [runtime]}
            - name: libvirt-domain-xml-virtio
              step:
                - {id: libvirt-domain-xml-virtio, libvirt: "domain-xml", stdout: {contains: "type='virtio'"}, context: [runtime]}
            - name: libvirt-qmp-query-status
              step:
                - {id: libvirt-qmp-query-status, libvirt: qmp, text: query-status, stdout: {contains: running}, context: [runtime]}
            - name: libvirt-guest-agent-ping
              step:
                - {id: libvirt-guest-agent-ping, libvirt: "guest/ping", stderr: {contains: responsive}, context: [runtime]}
            - name: libvirt-guest-hostname
              step:
                - {id: libvirt-guest-hostname, libvirt: "guest/hostname", stdout: {matches: ".+"}, context: [runtime]}
            - name: libvirt-guest-os-info
              step:
                - {id: libvirt-guest-os-info, libvirt: "guest/os-info", stdout: {contains: arch}, context: [runtime]}
            - name: libvirt-guest-interfaces
              step:
                - {id: libvirt-guest-interfaces, libvirt: "guest/interfaces", stdout: {contains: lo}, context: [runtime]}
            - name: pacman-key-populated
              step:
                # --- C.6  Pacman + repo health ---------------------------
                - {id: pacman-key-populated, command: "pacman-key --list-keys arch 2>&1 | grep -q pub", context: [runtime]}
            - name: pacman-repos-reachable
              step:
                - {id: pacman-repos-reachable, command: "sudo pacman -Sy --noconfirm", context: [runtime]}
            - name: ssh-authorized-keys
              step:
                # --- C.7  SSH key injection ------------------------------
                - {id: ssh-authorized-keys, command: "test -f /home/arch/.ssh/authorized_keys", context: [runtime]}
            - name: ssh-ed25519-key-count
              step:
                - {id: ssh-ed25519-key-count, command: "grep -c ssh-ed25519 /home/arch/.ssh/authorized_keys", stdout: {matches: "[1-9]"}, context: [runtime]}
            - name: cpu-count-4
              step:
                # --- C.8  Resource sizing (4 cpus, 8G mem, 40G disk) -----
                - {id: cpu-count-4, command: nproc, stdout: {matches: "^4"}, context: [runtime]}
            - name: mem-8g-ballpark
              step:
                - {id: mem-8g-ballpark, command: "awk '/MemTotal/ {print int($2/1024/1024)}' /proc/meminfo", stdout: {matches: "^[78]"}, context: [runtime]}
            - name: disk-ballpark
              step:
                - {id: disk-ballpark, command: "df -BG / | awk 'NR==2 {gsub(\"G\",\"\",$2); print int($2)}'", stdout: {matches: "^([1-9][0-9]|[1-9][0-9][0-9])"}, context: [runtime]}
            - name: ripgrep-version
              step:
                # --- C.9  Layer-applied tooling (ripgrep / uv / pre-commit) ----
                # NB: no `command -v charly` / `charly version` here. This VM uses
                # charly_install.strategy: auto, whose contract (charly/charly_install.go) is to
                # stage the host charly at /tmp/charly-<calver> for DEPLOY OPS ONLY —
                # deliberately NOT on the guest PATH, so it can never shadow a
                # package-managed charly. Asserting `command -v charly` therefore
                # contradicts the strategy. charly-installed-as-a-package-on-PATH in a
                # VM (the localpkg-on-VM path) is proven by the main repo's
                # check-charly-vm bed (add_candy: charly + localpkg-pac-autoresolve).
                - {id: ripgrep-version, command: "rg --version", stdout: {contains: ripgrep}, context: [runtime]}
            - name: uv-version
              step:
                - {id: uv-version, command: "uv --version", stdout: {contains: "uv "}, context: [runtime]}
            - name: pre-commit-version
              step:
                - {id: pre-commit-version, command: "pre-commit --version", stdout: {contains: pre-commit}, context: [runtime]}
            - name: tooling-on-path
              step:
                - {id: tooling-on-path, command: "command -v rg uv pre-commit", context: [runtime]}
            - name: pkg-base-devel-present
              step:
                # --- C.10 Structured probes (package/service/port/process/
                #          user/group/interface/kernel-param/mount) -------
                - {id: pkg-base-devel-present, package: base-devel, installed: true, context: [runtime]}
            - name: pkg-git-present
              step:
                - {id: pkg-git-present, package: git, installed: true, context: [runtime]}
            - name: svc-spice-vdagentd-running
              step:
                - {id: svc-spice-vdagentd-running, service: spice-vdagentd, running: true, context: [runtime]}
            - name: svc-sshd-running
              step:
                - {id: svc-sshd-running, service: sshd, running: true, context: [runtime]}
            - name: port-22-listening
              step:
                - {id: port-22-listening, port: 22, listening: true, context: [runtime]}
            - name: proc-sshd-running
              step:
                - {id: proc-sshd-running, process: sshd, running: true, context: [runtime]}
            - name: user-arch-present
              step:
                - {id: user-arch-present, user: arch, uid: 1000, context: [runtime]}
            - name: group-wheel-present
              step:
                - {id: group-wheel-present, group: wheel, context: [runtime]}
            - name: iface-lo-up
              step:
                - {id: iface-lo-up, interface: lo, mtu: 65536, context: [runtime]}
            - name: mount-root-mounted
              step:
                - {id: mount-root-mounted, mount: /, context: [runtime]}
            - name: dns-arch-org
              step:
                # --- C.11 Network / DNS (host-side + guest-side) ---------
                - {id: dns-arch-org, command: "getent hosts archlinux.org", context: [runtime]}
            - name: https-arch-org
              step:
                - {id: https-arch-org, command: "curl -sfo /dev/null -w '%{http_code}' https://archlinux.org/", stdout: {matches: "^(20[0-9]|30[0-9])"}, context: [runtime]}
            - name: dns-check-operator-side
              step:
                - {id: dns-check-operator-side, dns: archlinux.org, resolvable: true, context: [runtime]}
            - name: addr-ssh-reachable
              step:
                - {id: addr-ssh-reachable, addr: "127.0.0.1:2224", reachable: true, timeout: "5s", context: [runtime]}
            - name: matching-smoke
              step:
                # --- C.12 matching: verb smoke ---------------------------
                # matching: <literal> checks the literal against the contains:
                # matcher list. Operator-map elements ({equals: X}) keep their
                # authored op verbatim; `equals` is NOT a top-level Check field.
                - {id: matching-smoke, matching: "arch", contains: {equals: "arch"}, context: [runtime]}
vm:
    arch-pacstrap:
        source:
            kind: bootstrap
            builder: pacstrap
            # builder_image is the LOCAL arch-pacstrap-builder image (defined in
            # this repo's image: block), so it stays a bare local name.
            builder_image: arch-pacstrap-builder
            distro: arch
            package:
                - sudo
                - openssh
                - qemu-guest-agent
                - cloud-init
                - grub
                - efibootmgr
            rootfs: ext4
            kernel_args: console=tty0 console=ttyS0,115200
        disk_size: 20G
        ram: 4G
        cpu: 2
        machine: q35
        firmware: uefi-insecure
        network:
            mode: user
        ssh:
            user: arch
            port: 12225
            key_source: generate
        cloud_init:
            users:
                - name: arch
                  sudo: true
                  shell: /bin/bash
            runcmd:
                - systemctl enable --now sshd
                - systemctl enable --now qemu-guest-agent
                # Diagnostic: write network + sshd state to /boot so it can
                # be mount-inspected after a failed-boot cycle.
                - "{ ip a; echo ===listen===; ss -tlnp; echo ===sshd===; systemctl status sshd --no-pager; } > /boot/charly-diag.txt 2>&1"
    arch:
        source:
            kind: cloud_image
            url: https://fastly.mirror.pkgbuild.com/images/latest/Arch-Linux-x86_64-cloudimg.qcow2
            checksum:
                type: sha256
            base_user: arch
        # Disposability is NOT a VmSpec field (the schema-v3 cutover removed
        # VmSpec.Disposable / VmSpec.Lifecycle). The load-bearing copy lives on
        # the check.check-arch-vm bed below (`disposable: true` authorizes the
        # unattended destroy+rebuild). See /charly-internals:disposable.
        #
        # `backend: libvirt` is REQUIRED — the check-arch-vm bed's check list
        # contains 8 `charly check libvirt …` probes + 2 `charly check spice …`
        # probes that all hit the libvirt user-session daemon socket.
        # With `backend: auto` and the daemon NOT running on the
        # operator's machine, resolveVmBackend silently falls through
        # to direct-qemu and every libvirt-RPC probe fails with
        # "no such file or directory". Explicit `backend: libvirt`
        # makes resolveVmBackend fail loudly with a `systemctl --user
        # enable --now virtqemud.service` hint instead. See
        # /charly-vm:vm "Backend matrix" for the prereq.
        backend: libvirt
        disk_size: 40G
        ram: 8G
        cpu: 4
        machine: q35
        firmware: bios
        network:
            mode: user
        ssh:
            port: 2224
            key_source: generate
        cloud_init:
            timezone: UTC
            package:
                # The host's charly binary (PKGBUILD `depends=()`) is built
                # with cgo for SPICE audio: `gordonklaus/portaudio`
                # links against libportaudio.so.2; the SPICE protocol
                # path also pulls `libopusfile.so.0` and `libopus.so.0`
                # transitively. Under `charly_install.strategy: auto` the
                # host binary is scp'd into the guest, so the guest
                # MUST ship those .so files — `portaudio` and
                # `opusfile` (which pulls `opus`) cover all three.
                # Without any of them, `charly version` exits 127 with
                # "error while loading shared libraries".
                #
                # `base-devel` and `git` are required by the bed's
                # `package:` check probes (the check-arch-vm check list).
                # They were dropped in error during the runcmd cleanup
                # of the 2026-05 R10 follow-up; re-added 2026-05-06.
                - sudo
                - spice-vdagent
                - qemu-guest-agent
                - portaudio
                - opusfile
                - base-devel
                - git
            runcmd:
                # Activate the desktop / agent units that came in with
                # cloud_init.packages. The legacy charly-from-source build
                # block (git clone + makepkg + pacman -U) was DELETED
                # in the 2026-05 R10 follow-up: it was redundant with
                # `charly_install.strategy: auto` (which scps the host
                # binary post-boot via VmDeployTarget) AND timed out
                # under load — leaving non-empty errors[] in
                # /var/lib/cloud/data/result.json that broke the
                # `cloud-init no-errors` check probe.
                #
                # `pacman-key --init && --populate archlinux` is
                # required for post-boot pacman invocations driven
                # by `charly deploy add check-arch-vm <ref>` (layer install via
                # SSH). Without it, `pacman -Sy <pkg>` fails with
                # `keyring is not writable / required key missing`.
                # Cloud-init's own `packages:` step is unaffected
                # (cloud-init bootstraps its own keyring); only the
                # later operator-driven pacman calls need this.
                - pacman-key --init
                - pacman-key --populate archlinux
                - systemctl enable --now spice-vdagentd
                - systemctl enable --now qemu-guest-agent
            charly_install:
                # `auto` scps the host's charly binary into the guest
                # after cloud-init reaches steady-state. Sole install
                # path; no defence-in-depth runcmd fallback (it could
                # not consume the scp's failure signal anyway because
                # cloud-init runs before VmDeployTarget.Emit fires).
                strategy: auto
        libvirt:
            devices:
                channels:
                    - type: spicevmc
                      name: com.redhat.spice.0
                graphics:
                    - type: spice
                      listen:
                        - type: socket
                video:
                    - model: virtio
                      vram: 65536
                      heads: 1
                      accel3d: false
                rng:
                    - model: virtio
                      backend: /dev/urandom
                memballoon:
                    model: virtio
            snippets:
                - "<channel type='unix'><target type='virtio' name='org.qemu.guest_agent.0'/></channel>"
pod: {}
k8s: {}
