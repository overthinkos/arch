#  overthinkos/arch — the Arch Linux image family, split out of the main
#  overthink repo (2026-05). Mounted as a git submodule at image/arch.
#
#  SINGLE-FILE config (2026-05 import-namespace cutover): every local entity
#  (the arch-coder/arch-ov/arch-test images, the arch-pacstrap-builder +
#  arch-pacstrap bootstrap pair, the arch + arch-pacstrap VMs, and the
#  disposable eval beds) is inlined here. This repo VENDORS NOTHING — every
#  layer is an `@github.com/...` ref, and the shared build.yml vocabulary +
#  the main repo's arch base/builder arrive via `import:`.
#
#  import: has two shapes —
#    * flat string  → build.yml (shared distro/builder/init vocabulary), merged
#      into this repo's root namespace.
#    * `ov: <ref>`  → the main overthink repo mounted under the `ov` namespace,
#      so `ov.arch` (every arch image's base) + `ov.arch-builder` (the pixi/npm/
#      cargo/aur builder) resolve. Builder maps do NOT cross a namespace
#      boundary, so each image that builds a multi-stage format declares its own
#      `builder:` map qualified to `ov.arch-builder`.
#
#  Directly buildable: `ov image build arch-coder` (the build verb defaults to
#  this overthink.yml). From the parent repo: `ov -C image/arch image build
#  arch-coder`, or anywhere: `ov --repo overthinkos/arch image build arch-coder`.
version: 2026.143.844
defaults:
    platform:
        - linux/amd64
    tag: auto
    registry: ghcr.io/overthinkos
    build:
        - pac
    merge:
        auto: false
        max_mb: 128
import:
    # Shared build-config vocabulary (distro/builder/init) — flat root import.
    - '@github.com/overthinkos/overthink/build.yml:v2026.141.1600'
    # Main repo entities under the `ov` namespace — ov.arch (every arch image's
    # base) + ov.arch-builder (the multi-stage pixi/npm/cargo/aur builder).
    - ov: '@github.com/overthinkos/overthink:v2026.143.844'
discover:
    # Layers vendored locally by THIS repo — the arch-exclusive test fixtures
    # (arch-pac-test, arch-aur-test) relocated out of main's shared layers/.
    # Bare layer names below resolve here; every other layer still arrives by
    # @github ref into main.
    layer:
        - path: layers
          recursive: true
image:
    arch-coder:
        # base: ov.arch — the `arch` base from main's base.yml, via the `ov`
        # import namespace. distro:/build: are VALUES → inherited across the
        # namespace boundary; builder: is a map of namespace-relative REFS →
        # NOT inherited, so it is declared explicitly below.
        base: ov.arch
        # Explicit builder map: arch-coder compiles pixi (pixi/uv), npm (nodejs),
        # and cargo (rust) multi-stage layers. Builder maps do NOT cross the
        # `ov` import-namespace boundary, so each format routes to ov.arch-builder.
        builder:
            aur: ov.arch-builder
            cargo: ov.arch-builder
            npm: ov.arch-builder
            pixi: ov.arch-builder
        layer:
            - '@github.com/overthinkos/overthink/layers/agent-forwarding:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/sshd:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/ov-full:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/ov-mcp:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/container-nesting:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/dbus:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/tmux:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/language-runtimes:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/golang:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/nodejs:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/rust:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/pixi:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/uv:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/build-toolchain:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/dev-tools:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/pre-commit:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/direnv:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/gh:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/typst:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/asciinema:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/claude-code:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/codex:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/gemini:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/forgecode:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/oracle:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/devops-tools:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/kubernetes:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/docker-ce:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/github-actions:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/google-cloud:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/google-cloud-npm:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/grafana-tools:v2026.141.1600'
        port:
            - 2222:2222
            - 18765:18765
        eval:
            - command: test -x ${HOME}/.npm-global/bin/claude && test -x ${HOME}/.npm-global/bin/codex && test -x ${HOME}/.npm-global/bin/gemini && test -x ${HOME}/.npm-global/bin/forge
              id: arch-coder-ai-clis
              exit_status: 0
            - command: test -x /usr/bin/go && test -x /usr/bin/node && { test -x ${HOME}/.cargo/bin/cargo || test -x /usr/bin/cargo; }
              id: arch-coder-languages
              exit_status: 0
            - command: test -x /usr/bin/kubectl && test -x /usr/bin/docker && test -x /usr/local/bin/aws && test -x /usr/bin/gcloud && test -x /usr/local/bin/tofu
              id: arch-coder-devops
              exit_status: 0
            - command: test -x /usr/local/bin/ov
              id: arch-coder-ov
              exit_status: 0
            - addr: 127.0.0.1:${HOST_PORT:2222}
              id: arch-coder-sshd-port
              timeout: 5s
              scope: deploy
              reachable: true
            - command: ov version
              id: arch-coder-ov-version
              scope: deploy
              in_container: true
              exit_status: 0
            - addr: 127.0.0.1:${HOST_PORT:18765}
              id: arch-coder-mcp-port
              timeout: 5s
              scope: deploy
              reachable: true
    arch-ov:
        base: ov.arch
        layer:
            - '@github.com/overthinkos/overthink/layers/agent-forwarding:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/ov-full:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/ov-mcp:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/golang:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/gh:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/sshd:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/container-nesting:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/nvidia:v2026.141.1600'
        port:
            - 2222:2222
            - 18765:18765
    arch-test:
        base: ov.arch
        build:
            - pac
            - aur
        # Explicit builder map: arch-test builds an AUR layer (arch-aur-test).
        # Builder maps do NOT cross the `ov` import-namespace boundary, so the
        # aur format routes to ov.arch-builder explicitly.
        builder:
            aur: ov.arch-builder
        layer:
            - '@github.com/overthinkos/overthink/layers/agent-forwarding:v2026.141.1600'
            - arch-pac-test
            - arch-aur-test
    arch-pacstrap-builder:
        base: ov.arch
        distro:
            - arch
        build:
            - pac
        layer:
            - '@github.com/overthinkos/overthink/layers/pacstrap-builder:v2026.141.1600'
    arch-pacstrap:
        # Bootstrap-from-scratch Arch rootfs via pacstrap inside a privileged
        # builder container. bootstrap_builder_image points at the LOCAL
        # arch-pacstrap-builder image above (defined in this repo), so it stays
        # a bare local name — no `ov.` qualifier.
        from: builder:pacstrap
        bootstrap_builder_image: arch-pacstrap-builder
        distro:
            - arch
        build:
            - pac
vm:
    arch-pacstrap:
        source:
            kind: bootstrap
            builder: pacstrap
            # builder_image is the LOCAL arch-pacstrap-builder image (defined in
            # this repo's image: block), so it stays a bare local name.
            builder_image: arch-pacstrap-builder
            distro: arch
            package:
                - sudo
                - openssh
                - qemu-guest-agent
                - cloud-init
                - grub
                - efibootmgr
            rootfs: ext4
            kernel_args: console=tty0 console=ttyS0,115200
        disk_size: 20G
        ram: 4G
        cpu: 2
        machine: q35
        firmware: uefi-insecure
        network:
            mode: user
        ssh:
            user: arch
            port: 12225
            key_source: generate
        cloud_init:
            users:
                - name: arch
                  sudo: true
                  shell: /bin/bash
            runcmd:
                - systemctl enable --now sshd
                - systemctl enable --now qemu-guest-agent
                # Diagnostic: write network + sshd state to /boot so it can
                # be mount-inspected after a failed-boot cycle.
                - "{ ip a; echo ===listen===; ss -tlnp; echo ===sshd===; systemctl status sshd --no-pager; } > /boot/ov-diag.txt 2>&1"
    arch:
        source:
            kind: cloud_image
            url: https://fastly.mirror.pkgbuild.com/images/latest/Arch-Linux-x86_64-cloudimg.qcow2
            checksum:
                type: sha256
            base_user: arch
        # Disposability is NOT a VmSpec field (the schema-v3 cutover removed
        # VmSpec.Disposable / VmSpec.Lifecycle). The load-bearing copy lives on
        # the eval.arch-vm bed below (`disposable: true` authorizes the
        # unattended destroy+rebuild). See /ov-internals:disposable.
        #
        # `backend: libvirt` is REQUIRED — the arch-vm bed's eval list
        # contains 8 `ov eval libvirt …` probes + 2 `ov eval spice …`
        # probes that all hit the libvirt user-session daemon socket.
        # With `backend: auto` and the daemon NOT running on the
        # operator's machine, resolveVmBackend silently falls through
        # to direct-qemu and every libvirt-RPC probe fails with
        # "no such file or directory". Explicit `backend: libvirt`
        # makes resolveVmBackend fail loudly with a `systemctl --user
        # enable --now virtqemud.service` hint instead. See
        # /ov-vm:vm "Backend matrix" for the prereq.
        backend: libvirt
        disk_size: 40G
        ram: 8G
        cpu: 4
        machine: q35
        firmware: bios
        network:
            mode: user
        ssh:
            port: 2224
            key_source: generate
        cloud_init:
            timezone: UTC
            package:
                # The host's ov binary (PKGBUILD `depends=()`) is built
                # with cgo for SPICE audio: `gordonklaus/portaudio`
                # links against libportaudio.so.2; the SPICE protocol
                # path also pulls `libopusfile.so.0` and `libopus.so.0`
                # transitively. Under `ov_install.strategy: auto` the
                # host binary is scp'd into the guest, so the guest
                # MUST ship those .so files — `portaudio` and
                # `opusfile` (which pulls `opus`) cover all three.
                # Without any of them, `ov version` exits 127 with
                # "error while loading shared libraries".
                #
                # `base-devel` and `git` are required by the bed's
                # `package:` eval probes (the arch-vm eval list).
                # They were dropped in error during the runcmd cleanup
                # of the 2026-05 R10 follow-up; re-added 2026-05-06.
                - sudo
                - spice-vdagent
                - qemu-guest-agent
                - portaudio
                - opusfile
                - base-devel
                - git
            runcmd:
                # Activate the desktop / agent units that came in with
                # cloud_init.packages. The legacy ov-from-source build
                # block (git clone + makepkg + pacman -U) was DELETED
                # in the 2026-05 R10 follow-up: it was redundant with
                # `ov_install.strategy: auto` (which scps the host
                # binary post-boot via VmDeployTarget) AND timed out
                # under load — leaving non-empty errors[] in
                # /var/lib/cloud/data/result.json that broke the
                # `cloud-init no-errors` eval probe.
                #
                # `pacman-key --init && --populate archlinux` is
                # required for post-boot pacman invocations driven
                # by `ov deploy add arch-vm <ref>` (layer install via
                # SSH). Without it, `pacman -Sy <pkg>` fails with
                # `keyring is not writable / required key missing`.
                # Cloud-init's own `packages:` step is unaffected
                # (cloud-init bootstraps its own keyring); only the
                # later operator-driven pacman calls need this.
                - pacman-key --init
                - pacman-key --populate archlinux
                - systemctl enable --now spice-vdagentd
                - systemctl enable --now qemu-guest-agent
            ov_install:
                # `auto` scps the host's ov binary into the guest
                # after cloud-init reaches steady-state. Sole install
                # path; no defence-in-depth runcmd fallback (it could
                # not consume the scp's failure signal anyway because
                # cloud-init runs before VmDeployTarget.Emit fires).
                strategy: auto
        libvirt:
            devices:
                channels:
                    - type: spicevmc
                      name: com.redhat.spice.0
                graphics:
                    - type: spice
                      listen:
                        - type: socket
                video:
                    - model: virtio
                      vram: 65536
                      heads: 1
                      accel3d: false
                rng:
                    - model: virtio
                      backend: /dev/urandom
                memballoon:
                    model: virtio
            snippets:
                - "<channel type='unix'><target type='virtio' name='org.qemu.guest_agent.0'/></channel>"
eval:
    # Disposable R10 test beds for the arch VMs (kind:eval — the 2026-05
    # deploy→eval unification moved repo-shipped disposable beds out of
    # deploy.yml). disposable: true is the sole authorization for the
    # unattended destroy+rebuild driven by `ov eval run <bed>`. These are
    # zero-side-effect beds (target: vm); there are NO operator deploy entries
    # in this repo, so there is no deploy: section.
    arch-pacstrap-vm:
        target: vm
        vm: arch-pacstrap
        disposable: true
        lifecycle: dev
    arch-vm:
        target: vm
        vm: arch
        disposable: true
        lifecycle: dev
        # Minimal in-guest tooling so arch-host (child) has something
        # to depend on, and so the command: probes have ripgrep/uv/
        # pre-commit versions to verify.
        add_layer:
            - '@github.com/overthinkos/overthink/layers/ripgrep:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/uv:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/pre-commit:v2026.141.1600'
        install_opts:
            with_service: true
            allow_repo_changes: true # pacman-key + mirror tweaks
            skip_incompatible: true # skip rpm:/deb:-only layer sections
            verify: true
        env:
            - OVERTHINK_DEV=true
        eval:
            # --- C.1  Guest identity + SSH connectivity ---------------
            - {id: guest-identity-uid, scope: deploy, command: id, stdout: {contains: "uid=1000(arch)"}}
            - {id: guest-identity-wheel, scope: deploy, command: id, stdout: {contains: wheel}}
            - {id: guest-hostname-nonempty, scope: deploy, command: "cat /etc/hostname", stdout: {matches: ".+"}}
            - {id: guest-os-release-arch, scope: deploy, command: "cat /etc/os-release", stdout: {contains: "ID=arch"}}
            - {id: guest-sudo-nopasswd, scope: deploy, command: "sudo -n whoami", stdout: {equals: root}}
            - {id: guest-kernel-release, scope: deploy, command: "uname -r", stdout: {matches: "[0-9]+\\.[0-9]+"}}
            # --- C.2  Cloud-init completion ---------------------------
            - {id: cloud-init-status-done, scope: deploy, command: "cloud-init status --wait --long", stdout: {contains: "status: done"}}
            - {id: cloud-init-instance-dir, scope: deploy, command: "test -d /var/lib/cloud/instance"}
            - {id: cloud-init-no-errors, scope: deploy, command: "cat /var/lib/cloud/data/result.json", stdout: {contains: "\"errors\": []"}}
            # --- C.3  spice-vdagent + virtio-gpu (in guest) ----------
            - {id: spice-vdagentd-active, scope: deploy, command: "systemctl is-active spice-vdagentd", stdout: {equals: active}}
            - {id: spice-vdagentd-enabled, scope: deploy, command: "systemctl is-enabled spice-vdagentd", stdout: {matches: "^(enabled|static)"}}
            - {id: virtio-gpu-module, scope: deploy, command: "lsmod | grep -q virtio_gpu"}
            - {id: dri-card0-present, scope: deploy, command: "test -e /dev/dri/card0"}
            # --- C.4  SPICE wire (host-side via spice: verb) ---------
            - {id: spice-status-main, scope: deploy, spice: status, stdout: {contains: display}}
            - id: spice-framebuffer-nonzero
              scope: deploy
              spice: screenshot
              artifact: /tmp/arch-vm-spice.png
              artifact_min_bytes: 1024
            # --- C.5  libvirt domain (host-side via libvirt: verb) ---
            - {id: libvirt-domain-running, scope: deploy, libvirt: info, stdout: {contains: running}}
            - {id: libvirt-domain-xml-q35, scope: deploy, libvirt: "domain-xml", stdout: {contains: q35}}
            - {id: libvirt-domain-xml-virtio, scope: deploy, libvirt: "domain-xml", stdout: {contains: "type='virtio'"}}
            - {id: libvirt-qmp-query-status, scope: deploy, libvirt: qmp, text: query-status, stdout: {contains: running}}
            - {id: libvirt-guest-agent-ping, scope: deploy, libvirt: "guest/ping", stderr: {contains: responsive}}
            - {id: libvirt-guest-hostname, scope: deploy, libvirt: "guest/hostname", stdout: {matches: ".+"}}
            - {id: libvirt-guest-os-info, scope: deploy, libvirt: "guest/os-info", stdout: {contains: arch}}
            - {id: libvirt-guest-interfaces, scope: deploy, libvirt: "guest/interfaces", stdout: {contains: lo}}
            # --- C.6  Pacman + repo health ---------------------------
            - {id: pacman-key-populated, scope: deploy, command: "pacman-key --list-keys arch 2>&1 | grep -q pub"}
            - {id: pacman-repos-reachable, scope: deploy, command: "sudo pacman -Sy --noconfirm"}
            # --- C.7  SSH key injection ------------------------------
            - {id: ssh-authorized-keys, scope: deploy, command: "test -f /home/arch/.ssh/authorized_keys"}
            - {id: ssh-ed25519-key-count, scope: deploy, command: "grep -c ssh-ed25519 /home/arch/.ssh/authorized_keys", stdout: {matches: "[1-9]"}}
            # --- C.8  Resource sizing (4 cpus, 8G mem, 40G disk) -----
            - {id: cpu-count-4, scope: deploy, command: nproc, stdout: {matches: "^4"}}
            - {id: mem-8g-ballpark, scope: deploy, command: "awk '/MemTotal/ {print int($2/1024/1024)}' /proc/meminfo", stdout: {matches: "^[78]"}}
            - {id: disk-ballpark, scope: deploy, command: "df -BG / | awk 'NR==2 {gsub(\"G\",\"\",$2); print int($2)}'", stdout: {matches: "^([1-9][0-9]|[1-9][0-9][0-9])"}}
            # --- C.9  Layer-applied tooling + ov itself --------------
            - {id: ov-binary-present, scope: deploy, command: "command -v ov"}
            - {id: ov-version, scope: deploy, command: "ov version", stdout: {matches: "[0-9]{4}\\.[0-9]+"}}
            - {id: ov-help-works, scope: deploy, command: "ov --help 2>&1 | head -1", stdout: {contains: ov}}
            - {id: ripgrep-version, scope: deploy, command: "rg --version", stdout: {contains: ripgrep}}
            - {id: uv-version, scope: deploy, command: "uv --version", stdout: {contains: "uv "}}
            - {id: pre-commit-version, scope: deploy, command: "pre-commit --version", stdout: {contains: pre-commit}}
            - {id: tooling-on-path, scope: deploy, command: "command -v rg uv pre-commit"}
            # --- C.10 Structured probes (package/service/port/process/
            #          user/group/interface/kernel-param/mount) -------
            - {id: pkg-base-devel-present, scope: deploy, package: base-devel, installed: true}
            - {id: pkg-git-present, scope: deploy, package: git, installed: true}
            - {id: svc-spice-vdagentd-running, scope: deploy, service: spice-vdagentd, running: true}
            - {id: svc-sshd-running, scope: deploy, service: sshd, running: true}
            - {id: port-22-listening, scope: deploy, port: 22, listening: true}
            - {id: proc-sshd-running, scope: deploy, process: sshd, running: true}
            - {id: user-arch-present, scope: deploy, user: arch, uid: 1000}
            - {id: group-wheel-present, scope: deploy, group: wheel}
            - {id: iface-lo-up, scope: deploy, interface: lo, mtu: 65536}
            - {id: mount-root-mounted, scope: deploy, mount: /}
            # --- C.11 Network / DNS (host-side + guest-side) ---------
            - {id: dns-arch-org, scope: deploy, command: "getent hosts archlinux.org"}
            - {id: https-arch-org, scope: deploy, command: "curl -sfo /dev/null -w '%{http_code}' https://archlinux.org/", stdout: {matches: "^(20[0-9]|30[0-9])"}}
            - {id: dns-check-operator-side, scope: deploy, dns: archlinux.org, resolvable: true}
            - {id: addr-ssh-reachable, scope: deploy, addr: "127.0.0.1:2224", reachable: true, timeout: "5s"}
            # --- C.12 matching: verb smoke ---------------------------
            # matching: <literal> checks the literal against the contains:
            # matcher list. Operator-map elements ({equals: X}) keep their
            # authored op verbatim; `equals` is NOT a top-level Check field.
            - {id: matching-smoke, scope: deploy, matching: "arch", contains: {equals: "arch"}}
        # -----------------------------------------------------------------
        # Bed 2: arch-host (target: host, nested in arch-vm)
        # -----------------------------------------------------------------
        # Exercises HostDeployTarget / InstallPlan / ReverseOps / ledger
        # code path INSIDE arch-vm's guest FS via the existing
        # parent-child NestedExecutor plumbing. Zero operator-side writes.
        # Layers chosen for dotfile-only side effects so the bed is about
        # exercising the code path, not installing services.
        # -----------------------------------------------------------------
        nested:
            # -----------------------------------------------------------------
            # R10 bed for tailscale + tailscale-up runtime wiring.
            # ---------------------------------------------------------------
            # Exercises layers/tailscale (daemon install + systemctl enable)
            # AND layers/tailscale-up (--operator + --hostname runtime task)
            # via the nested HostDeployTarget in arch-vm. The arch user
            # has uid 1000 + passwordless wheel sudo per the cloud-init
            # config, matching the canonical ov-cachyos host shape.
            # The test bed's tailscaled is logged out (no auth performed),
            # which is the layer's expected pass-by-skip state for the
            # operator-readable / hostname-tracks-system probes — the
            # explicit baseline probes below cover the daemon-up shape.
            # -----------------------------------------------------------------
            ov-cachyos-tailscale-test:
                target: local
                disposable: true
                lifecycle: dev
                add_layer:
                    - '@github.com/overthinkos/overthink/layers/tailscale:v2026.141.1600'
                    - '@github.com/overthinkos/overthink/layers/tailscale-up:v2026.141.1600'
                install_opts:
                    with_service: true
                    allow_root_tasks: true
                description:
                    feature: R10 bed for tailscale + tailscale-up runtime wiring
                    tag: [testing]
                eval:
                    - {id: tt-tailscale-binary, scope: deploy, command: "test -x /usr/bin/tailscale && test -x /usr/sbin/tailscaled"}
                    - {id: tt-tailscaled-active, scope: deploy, command: "systemctl is-active tailscaled", stdout: {equals: active}}
                    - {id: tt-tailscaled-enabled, scope: deploy, command: "systemctl is-enabled tailscaled.service", stdout: {matches: "^enabled"}}
                    # The layer-baked operator-readable + hostname-tracks-system
                    # probes self-gate via the "Logged out" check and
                    # pass-by-skip on this bed (no `tailscale up` is performed).
            arch-host:
                target: local
                disposable: true
                lifecycle: dev
                add_layer:
                    - '@github.com/overthinkos/overthink/layers/direnv:v2026.141.1600'
                eval:
                    # Nested command runs: SSH into arch-vm → exec as arch user.
                    # `ov deploy show` lists entries in schema v4 (there is
                    # no `ov deploy list` subcommand).
                    - {id: ah-ov-deploy-show, scope: deploy, command: "ov deploy show"}
                    - {id: ah-direnv-version, scope: deploy, command: "direnv --version"}
                    # Ledger entries land in guest ~/.config/overthink/installed/
                    # (NOT operator-side).
                    - {id: ah-ledger-deploys-dir, scope: deploy, command: "test -d /home/arch/.config/overthink/installed/deploys"}
                    - {id: ah-ledger-layers-dir, scope: deploy, command: "test -d /home/arch/.config/overthink/installed/layers"}
                    # Ledger directories exist (created on first nested
                    # host-deploy). Per-layer/per-deploy ledger files are
                    # written on the OPERATOR side for nested host-
                    # deploys today (known nested-routing rough edge —
                    # unrelated to schema v4).
                    # On Arch, direnv ships as a pacman package, so the
                    # direnv layer installs it that way (no user-space
                    # bootstrap needed). installed: true is correct.
                    - {id: ah-direnv-installed, scope: deploy, package: direnv, installed: true}
                    # Nothing listening (host overlay runs no services).
                    - {id: ah-no-listeners, scope: deploy, command: "ss -tlnp 2>/dev/null | wc -l", stdout: {matches: "^[0-9]+"}}
                    # matching: verb — operator-map form {contains: X} gives
                    # substring semantics; bare scalar shorthand is equals.
                    - {id: ah-matching-list, scope: deploy, matching: "arch-host in list", contains: {contains: "arch"}}
