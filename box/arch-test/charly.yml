box:
    name: arch-test
    base: arch
    build:
        - pac
        - aur
    # Explicit builder map: arch-test builds an AUR layer (arch-aur-test); the
    # aur format routes to the local arch-builder.
    builder:
        aur: arch-builder
    candy:
        - '@github.com/overthinkos/overthink/candy/agent-forwarding:v2026.160.2017'
        - arch-pac-test
        - arch-aur-test
