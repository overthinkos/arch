arch-test:
    box:
        base: arch
        build:
            - pac
            - aur
        # Explicit builder map: arch-test builds an AUR layer (arch-aur-test); the
        # aur format routes to the local arch-builder.
        builder:
            aur: arch-builder
    arch-test-candy:
        candy:
            - '@github.com/overthinkos/overthink/candy/agent-forwarding:v2026.170.1105'
            - arch-pac-test
            - arch-aur-test
