#  Per-kind file for image entries. Sibling of overthink.yml — included via
#  overthink.yml's `includes:` list. The schema kind discriminator is
#  `kind: image` for kind-keyed entries; root-shape map is `image:` (this file).
#  2026-05 kind-files cutover.
version: 2026.156.1531
box:
    arch-coder:
        # base: ov.arch — the `arch` base from main's base.yml, via the `ov`
        # import namespace. distro:/build: are VALUES → inherited across the
        # namespace boundary; builder: is a map of namespace-relative REFS →
        # NOT inherited, so it is declared explicitly below.
        base: ov.arch
        # Explicit builder map: arch-coder compiles pixi (pixi/uv), npm (nodejs),
        # and cargo (rust) multi-stage layers. Builder maps do NOT cross the
        # `ov` import-namespace boundary, so each format routes to ov.arch-builder.
        builder:
            aur: ov.arch-builder
            cargo: ov.arch-builder
            npm: ov.arch-builder
            pixi: ov.arch-builder
        candy:
            - '@github.com/overthinkos/overthink/candy/agent-forwarding:v2026.141.1600'
            - '@github.com/overthinkos/overthink/candy/sshd:v2026.141.1600'
            - '@github.com/overthinkos/overthink/candy/ov:v2026.156.2017'
            - '@github.com/overthinkos/overthink/candy/ov-mcp:v2026.141.1600'
            - '@github.com/overthinkos/overthink/candy/container-nesting:v2026.141.1600'
            - '@github.com/overthinkos/overthink/candy/dbus:v2026.141.1600'
            - '@github.com/overthinkos/overthink/candy/tmux:v2026.141.1600'
            - '@github.com/overthinkos/overthink/candy/language-runtimes:v2026.141.1600'
            - '@github.com/overthinkos/overthink/candy/golang:v2026.141.1600'
            - '@github.com/overthinkos/overthink/candy/nodejs:v2026.141.1600'
            - '@github.com/overthinkos/overthink/candy/rust:v2026.141.1600'
            - '@github.com/overthinkos/overthink/candy/pixi:v2026.141.1600'
            - '@github.com/overthinkos/overthink/candy/uv:v2026.141.1600'
            - '@github.com/overthinkos/overthink/candy/build-toolchain:v2026.141.1600'
            - '@github.com/overthinkos/overthink/candy/dev-tools:v2026.141.1600'
            - '@github.com/overthinkos/overthink/candy/pre-commit:v2026.141.1600'
            - '@github.com/overthinkos/overthink/candy/direnv:v2026.141.1600'
            - '@github.com/overthinkos/overthink/candy/gh:v2026.141.1600'
            - '@github.com/overthinkos/overthink/candy/typst:v2026.141.1600'
            - '@github.com/overthinkos/overthink/candy/asciinema:v2026.141.1600'
            - '@github.com/overthinkos/overthink/candy/claude-code:v2026.141.1600'
            - '@github.com/overthinkos/overthink/candy/codex:v2026.141.1600'
            - '@github.com/overthinkos/overthink/candy/gemini:v2026.141.1600'
            - '@github.com/overthinkos/overthink/candy/forgecode:v2026.141.1600'
            - '@github.com/overthinkos/overthink/candy/oracle:v2026.141.1600'
            - '@github.com/overthinkos/overthink/candy/devops-tools:v2026.141.1600'
            - '@github.com/overthinkos/overthink/candy/kubernetes:v2026.141.1600'
            - '@github.com/overthinkos/overthink/candy/docker-ce:v2026.141.1600'
            - '@github.com/overthinkos/overthink/candy/github-actions:v2026.141.1600'
            - '@github.com/overthinkos/overthink/candy/google-cloud:v2026.141.1600'
            - '@github.com/overthinkos/overthink/candy/google-cloud-npm:v2026.141.1600'
            - '@github.com/overthinkos/overthink/candy/grafana-tools:v2026.141.1600'
        port:
            - 2222:2222
            - 18765:18765
        eval:
            - command: test -x ${HOME}/.npm-global/bin/claude && test -x ${HOME}/.npm-global/bin/codex && test -x ${HOME}/.npm-global/bin/gemini && test -x ${HOME}/.npm-global/bin/forge
              id: arch-coder-ai-clis
              exit_status: 0
            - command: test -x /usr/bin/go && test -x /usr/bin/node && { test -x ${HOME}/.cargo/bin/cargo || test -x /usr/bin/cargo; }
              id: arch-coder-languages
              exit_status: 0
            - command: test -x /usr/bin/kubectl && test -x /usr/bin/docker && test -x /usr/local/bin/aws && test -x /usr/bin/gcloud && test -x /usr/local/bin/tofu
              id: arch-coder-devops
              exit_status: 0
            - command: test -x /usr/local/bin/ov
              id: arch-coder-ov
              exit_status: 0
            - addr: 127.0.0.1:${HOST_PORT:2222}
              id: arch-coder-sshd-port
              timeout: 5s
              scope: deploy
              reachable: true
            - command: ov version
              id: arch-coder-ov-version
              scope: deploy
              in_container: true
              exit_status: 0
            - addr: 127.0.0.1:${HOST_PORT:18765}
              id: arch-coder-mcp-port
              timeout: 5s
              scope: deploy
              reachable: true
    arch-ov:
        base: ov.arch
        candy:
            - '@github.com/overthinkos/overthink/candy/agent-forwarding:v2026.141.1600'
            - '@github.com/overthinkos/overthink/candy/ov:v2026.156.2017'
            - '@github.com/overthinkos/overthink/candy/ov-mcp:v2026.141.1600'
            - '@github.com/overthinkos/overthink/candy/golang:v2026.141.1600'
            - '@github.com/overthinkos/overthink/candy/gh:v2026.141.1600'
            - '@github.com/overthinkos/overthink/candy/sshd:v2026.141.1600'
            - '@github.com/overthinkos/overthink/candy/container-nesting:v2026.141.1600'
            - '@github.com/overthinkos/overthink/candy/nvidia:v2026.141.1600'
        port:
            - 2222:2222
            - 18765:18765
    arch-test:
        base: ov.arch
        build:
            - pac
            - aur
        # Explicit builder map: arch-test builds an AUR layer (arch-aur-test).
        # Builder maps do NOT cross the `ov` import-namespace boundary, so the
        # aur format routes to ov.arch-builder explicitly.
        builder:
            aur: ov.arch-builder
        candy:
            - '@github.com/overthinkos/overthink/candy/agent-forwarding:v2026.141.1600'
            - arch-pac-test
            - arch-aur-test
    arch-pacstrap-builder:
        base: ov.arch
        distro:
            - arch
        build:
            - pac
        candy:
            - '@github.com/overthinkos/overthink/candy/pacstrap-builder:v2026.141.1600'
    arch-pacstrap:
        # Bootstrap-from-scratch Arch rootfs via pacstrap inside a privileged
        # builder container. bootstrap_builder_image points at the LOCAL
        # arch-pacstrap-builder image above (defined in this repo), so it stays
        # a bare local name — no `ov.` qualifier.
        # Dedicated version: a layerless bootstrap image on a builder `from:` has
        # no layer chain to derive org.overthinkos.version from, so it carries its
        # own CalVer (the entity-version migrate step doesn't cover the bootstrap
        # `from: builder:` shape).
        version: 2026.156.2017
        from: builder:pacstrap
        bootstrap_builder_image: arch-pacstrap-builder
        distro:
            - arch
        build:
            - pac
