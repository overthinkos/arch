candy:
    version: 2026.144.1443
    name: arch-pac-test
    description:
        feature: pacman repo install smoke test — installs neovim and ripgrep
        narrative: |
            Minimal candy that exercises the Arch pacman repo install path by
            installing neovim and ripgrep. Verifiable: both binaries (nvim, rg)
            land on PATH and the packages are registered.
        tag: [working]
        scenario:
            - name: pacman-packages-installed
              step:
                - then: the neovim editor binary is installed at /usr/bin/nvim
                  file: /usr/bin/nvim
                  exists: true
                - then: the ripgrep binary is installed at /usr/bin/rg
                  file: /usr/bin/rg
                  exists: true
    distro:
        arch:
            package:
                - neovim
                - ripgrep
    eval:
        - id: nvim-binary
          file: /usr/bin/nvim
          exists: true
        - id: nvim-package
          package: neovim
          installed: true
        - id: rg-binary
          file: /usr/bin/rg
          exists: true
        - id: ripgrep-package
          package: ripgrep
          installed: true
